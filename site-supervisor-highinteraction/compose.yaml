services:
  site-supervisor:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:80"
    volumes:
      - supervisor_runtime:/var/www/html/private
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    pids_limit: 100
    mem_limit: 256m
volumes:
  supervisor_runtime:
