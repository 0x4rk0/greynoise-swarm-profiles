# Front the honeypot to better match real Site Supervisor HTTP fingerprint.
# Observed real device: NO Server header; security headers as below; port often 8010.
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
  # Hide nginx version / Server banner (real sample had no Server header)
  server_tokens off;
  more_clear_headers Server;
  # Fallback if headers-more module unavailable:
  # proxy_hide_header Server;  (can't invent empty Server easily without headers-more)

  access_log /var/log/nginx/access.log;
  upstream honeypot { server 127.0.0.1:8010; }

  server {
    listen 8010;
    listen 80;
    # Optional TLS on 443 — real units often enable TLS for web traffic
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/cert.pem;
    # ssl_certificate_key /etc/nginx/certs/key.pem;

    location / {
      proxy_pass http://honeypot;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_hide_header Server;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload" always;
      add_header Content-Security-Policy "object-src 'none'" always;
      add_header X-Permitted-Cross-Domain-Policies "none" always;
      add_header X-XSS-Protection "1" always;
    }
  }
}
