# Optional: honeypot + nginx front for Server-header stripping / multi-port
services:
  honeypot:
    build: .
    ports:
      - "8010:8010"
    volumes:
      - ./logs:/app/logs
    environment:
      - PORT=8010
      # Real-time alerts (optional) — ntfy / slack / discord / json
      # - ALERT_WEBHOOK_URL=https://ntfy.sh/your-private-topic
      # - ALERT_WEBHOOK_FORMAT=ntfy
    restart: unless-stopped
